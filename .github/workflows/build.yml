name: Compile iOS App Package

on:
  push:
    branches: [ main ] # Runs automatically every time you push code changes

jobs:
  build_ios:
    name: Run Mac Cloud Compiler
    runs-on: macos-latest # Instructs GitHub to deploy a clean Mac virtual machine
    
    steps:
      - name: Fetch Code Files
        uses: actions/checkout@v4

      - name: Initialize Flutter SDK Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fetch App Map Dependencies
        run: flutter pub get

      - name: Compile Unsigned IPA Package File
        run: flutter build ipa --release --no-codesign

      - name: Relocate Finished App Package
        run: |
          mkdir -p Payload
          mv build/ios/ipa/*.app Payload/ 2>/dev/null || mv build/ios/archive/Runner.xcarchive/Products/Applications/*.app Payload/
          zip -r VanishClone.ipa Payload

      - name: Render Downloadable App File
        uses: actions/upload-artifact@v4
        with:
          name: VanishClone-App-Package
          path: VanishClone.ipa
